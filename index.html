<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corte · Gastos, tarjetas y ahorro</title>
<meta name="description" content="Control personal de gastos por periodo 16–15, tarjetas de crédito con fecha de corte y ahorros con interés compuesto diario.">
<meta name="theme-color" content="#1F5C45" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Corte">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231F5C45'/%3E%3Cpath d='M12 12 L19.5 7.6 A8.6 8.6 0 1 0 19.5 16.4 Z' fill='%23F3EFE6'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F3EFE6; --surface:#FFFDF8; --surface-2:#F8F4EB; --ink:#1B2420; --muted:#68706A; --line:#E2DBCC;
  --brand:#1F5C45; --brand-2:#2D7A5C; --on-brand:#FFFFFF; --brand-soft:#E3EFE8;
  --credit:#B4492F; --credit-soft:#F7E4DD; --cash:#1F5C45; --cash-soft:#E3EFE8;
  --warn:#9A6400; --warn-soft:#FBEFCF; --danger:#B3261E; --danger-soft:#FADCD9; --neutral-soft:#ECE7DB;
  --s1:#1F5C45; --s2:#B4492F; --s3:#3A4F8C; --s4:#C98A0B;
  --radius:18px; --radius-sm:12px; --shadow:0 1px 0 rgba(27,36,32,.04),0 6px 20px -12px rgba(27,36,32,.25);
  --nav-h:64px; --safe-b:env(safe-area-inset-bottom,0px);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101412; --surface:#181D1A; --surface-2:#1F2521; --ink:#ECE8DF; --muted:#9BA39D; --line:#2B322E;
    --brand:#62B78F; --brand-2:#7BC9A3; --on-brand:#0D1A14; --brand-soft:#1D3229;
    --credit:#E8846A; --credit-soft:#3A2420; --cash:#62B78F; --cash-soft:#1D3229;
    --warn:#E6B54A; --warn-soft:#3A2F14; --danger:#F2776C; --danger-soft:#3D1F1C; --neutral-soft:#262C28;
    --s1:#62B78F; --s2:#E8846A; --s3:#8FA3E0; --s4:#E6B54A;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181D1A; --surface-2:#1F2521; --ink:#ECE8DF; --muted:#9BA39D; --line:#2B322E;
  --brand:#62B78F; --brand-2:#7BC9A3; --on-brand:#0D1A14; --brand-soft:#1D3229;
  --credit:#E8846A; --credit-soft:#3A2420; --cash:#62B78F; --cash-soft:#1D3229;
  --warn:#E6B54A; --warn-soft:#3A2F14; --danger:#F2776C; --danger-soft:#3D1F1C; --neutral-soft:#262C28;
  --s1:#62B78F; --s2:#E8846A; --s3:#8FA3E0; --s4:#E6B54A;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 84px)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.monto{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.01em}
a{color:var(--brand)}
.oculto{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Encabezado con selector de periodo ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.marca{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.marca svg{width:26px;height:26px}
.periodo{margin-left:auto;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);position:relative}
.periodo button{border:0;background:none;width:38px;height:40px;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;border-radius:999px}
.periodo button:disabled{opacity:.3}
.periodo-et{position:relative;padding:0 2px;font-weight:650;font-size:14px;white-space:nowrap;min-width:118px;text-align:center}
.periodo-et small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:-1px}
.periodo-et select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}

main{max-width:720px;margin:0 auto;padding:6px 16px 0}
.vista-tit{display:flex;align-items:baseline;justify-content:space-between;margin:14px 2px 10px;gap:8px}
.vista-tit h2{font-size:24px;font-weight:800}
.vista-tit .sub{color:var(--muted);font-size:13px}

/* ---------- Tarjetas (superficies) ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h3{font-size:15px;font-weight:750;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .link{font:600 13px var(--font);color:var(--brand);background:none;border:0;padding:4px 0;cursor:pointer}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.perfo{border:0;border-top:2px dashed var(--line);margin:14px -16px;position:relative}
.perfo::before,.perfo::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perfo::before{left:-9px;clip-path:inset(0 0 0 50%)} .perfo::after{right:-9px;clip-path:inset(0 50% 0 0)}

.hero{background:var(--brand);color:var(--on-brand);border-color:transparent;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:22px solid rgba(255,255,255,.07)}
.hero .eyebrow{color:color-mix(in srgb,var(--on-brand) 75%,transparent)}
.hero .grande{font:800 38px/1.1 var(--font-display);letter-spacing:-.03em;margin:4px 0 2px}
.hero .formula{font-size:12.5px;opacity:.82}
.hero .delta{display:inline-block;margin-top:8px;font-size:12px;font-weight:650;background:rgba(255,255,255,.14);padding:3px 8px;border-radius:999px}
.hero .neg{color:#FFD5CC}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 10px 9px;min-width:0}
.tile b{display:block;font:750 16px/1.2 var(--font-display);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
.up{color:var(--credit)} .down{color:var(--cash)}

.filas{display:grid;gap:7px}
.f{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.f span:first-child{color:var(--muted)}
.f.fuerte span{color:var(--ink);font-weight:700}
.f .sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:0}
.sep{height:1px;background:var(--line);margin:6px 0}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi b{display:block;font:800 22px/1.15 var(--font-display);letter-spacing:-.02em}
.kpi small{color:var(--muted);font-size:12px}
.barra{height:12px;border-radius:999px;background:var(--neutral-soft);overflow:hidden;display:flex;margin:10px 0 12px}
.barra i{display:block;height:100%}
.medidor{height:7px;border-radius:999px;background:var(--neutral-soft);overflow:hidden;margin-top:6px}
.medidor i{display:block;height:100%;background:var(--brand);border-radius:999px}
.medidor.alto i{background:var(--warn)} .medidor.lleno i{background:var(--danger)}

/* ---------- Etiquetas ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag-pagado{background:var(--cash-soft);color:var(--cash)}
.tag-credito{background:var(--credit-soft);color:var(--credit)}
.tag-sin{background:var(--neutral-soft);color:var(--muted)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-danger{background:var(--danger-soft);color:var(--danger)}
.tag-ok{background:var(--cash-soft);color:var(--cash)}
.nec{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-left:5px;vertical-align:2px}

/* ---------- Avisos ---------- */
.aviso{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:var(--radius-sm);margin-bottom:10px;font-size:13.5px;border:1px solid}
.aviso b{font-weight:700}
.aviso .acc{margin-left:auto;white-space:nowrap}
.aviso.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--ink)}
.aviso.danger{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.aviso.info{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 25%,transparent)}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:650;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.prim{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.peligro{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.chico{min-height:34px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.bloque{width:100%}
.btn:active{transform:translateY(1px)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.fab{position:fixed;z-index:30;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);height:58px;padding:0 22px 0 18px;border-radius:999px;border:0;
  background:var(--credit);color:#fff;font:800 17px var(--font-display);display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--credit) 70%,transparent);cursor:pointer}
.fab span{font-size:26px;line-height:0;margin-top:-2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fab{color:#1A0F0B}}
:root[data-theme="dark"] .fab{color:#1A0F0B}

/* ---------- Navegación inferior ---------- */
.nav{position:fixed;z-index:25;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:650;color:var(--muted);cursor:pointer}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--brand)}
.nav button[aria-current="page"] svg{stroke-width:2.3}

/* ---------- Listas de movimientos ---------- */
.lista{list-style:none;margin:0;padding:0}
.dia{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 4px 6px}
.mov{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;cursor:pointer}
.mov .izq{flex:1;min-width:0}
.mov .izq b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .izq small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .der{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;max-width:48%}
.mov .der b{font-variant-numeric:tabular-nums;font-weight:750}
.mov input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
.mov.sel{outline:2px solid var(--brand)}
.vacio{text-align:center;color:var(--muted);padding:28px 10px}

.filtros{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.filtros::-webkit-scrollbar{display:none}
.filtros select,.filtros .btn{flex:0 0 auto;min-height:36px;border-radius:999px;font-size:13px;padding:0 12px}
.filtros select{border:1px solid var(--line);background:var(--surface);max-width:180px}
.filtros select.activo{border-color:var(--brand);color:var(--brand);font-weight:700}
.buscar{position:relative;margin-bottom:8px}
.buscar input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 38px}
.buscar svg{position:absolute;left:12px;top:12px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.lote{position:sticky;top:62px;z-index:15;display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:14px;margin-bottom:10px}
.lote .btn{min-height:34px;font-size:13px;background:transparent;color:inherit;border-color:color-mix(in srgb,var(--bg) 35%,transparent)}

/* ---------- Tarjetas de crédito ---------- */
.cal{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.cal:first-of-type{border-top:0;padding-top:2px}
.cal .fecha{width:52px;flex:0 0 52px;text-align:center;border-radius:12px;padding:6px 0;background:var(--surface-2);border:1px solid var(--line)}
.cal .fecha b{display:block;font:800 20px/1 var(--font-display)}
.cal .fecha small{font-size:11px;text-transform:uppercase;font-weight:700;color:var(--muted)}
.cal.vence .fecha{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.cal.vencida .fecha{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.cal .info{flex:1;min-width:0}
.cal .info b{display:block}
.cal .info small{display:block;color:var(--muted);font-size:12.5px}
.cal .der{text-align:right}
.cal .der b{display:block;font-variant-numeric:tabular-nums}
.plastico{position:relative;border-radius:16px;padding:14px 16px;color:#fff;margin-bottom:10px;cursor:pointer;overflow:hidden;box-shadow:var(--shadow)}
.plastico::before{content:"";position:absolute;inset:0;background:linear-gradient(130deg,rgba(255,255,255,.14),transparent 55%)}
.plastico .t1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;position:relative}
.plastico .alias{font:800 18px var(--font-display)}
.plastico .banco{font-size:12px;opacity:.85}
.plastico .ult{font:600 13px ui-monospace,Menlo,monospace;opacity:.9;letter-spacing:.1em}
.plastico .t2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;position:relative;font-size:12px}
.plastico .t2 b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.plastico .uso{position:relative;margin-top:10px;font-size:12.5px;opacity:.9}
.plastico .med{position:relative;height:5px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:10px;overflow:hidden}
.plastico .med i{display:block;height:100%;background:#fff;border-radius:9px}
.tabla{width:100%;border-collapse:collapse;font-size:13.5px}
.tabla th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}
.tabla td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tabla td.n,.tabla th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabla tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto;margin:0 -4px}
.tabla.compacta{font-size:12.5px}.tabla.compacta td,.tabla.compacta th{padding:7px 3px}

/* ---------- Gráfica de categorías ---------- */
.graf{width:100%;height:auto;display:block}
.graf text{font-family:var(--font);fill:var(--ink)}
.graf .lbl{font-size:12.5px;font-weight:600}
.graf .val{font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}
.leyenda{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.subcats{margin:6px 0 4px;padding:10px 12px;background:var(--surface-2);border-radius:12px}

/* ---------- Formularios (hoja inferior) ---------- */
dialog.hoja{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:92dvh;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink);
  box-shadow:0 -10px 40px rgba(0,0,0,.25);overflow:hidden}
dialog.hoja::backdrop{background:rgba(10,14,12,.45)}
@media (min-width:700px){dialog.hoja{margin:auto;border-radius:22px}}
.hoja-cab{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.hoja-cab h2{font-size:18px}
.hoja-cab button{border:0;background:var(--neutral-soft);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink)}
.hoja-cuerpo{padding:14px 16px calc(16px + var(--safe-b));overflow-y:auto;max-height:calc(92dvh - 60px)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:12.5px;font-weight:650;color:var(--muted)}
.form input,.form select,.form textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:16px;color:var(--ink)}
.form textarea{padding:10px 12px;min-height:70px}
.form input:focus,.form select:focus,.form textarea:focus,.buscar input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.form .fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .ayuda{font-size:12px;color:var(--muted);font-weight:500;margin-top:-4px}
.form .check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);font-weight:600}
.form .check input{width:22px;height:22px;min-height:0;accent-color:var(--brand)}
.monto-grande{display:flex;align-items:center;gap:4px;border-bottom:2px solid var(--line);padding:2px 2px 6px}
.monto-grande span{font:800 30px var(--font-display);color:var(--muted)}
.monto-grande input{border:0!important;background:none!important;font:800 38px var(--font-display)!important;padding:0!important;min-height:52px!important;outline:none!important;letter-spacing:-.02em}
.monto-grande:focus-within{border-color:var(--brand)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--cash);color:var(--on-brand);border-color:transparent}
.seg button.cr[aria-pressed="true"]{background:var(--credit);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.acciones{display:flex;gap:8px;margin-top:4px}
.acciones .btn{flex:1}
.acciones .btn.peligro{flex:0 0 auto}
.prev-tag{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}

/* ---------- Más ---------- */
.menu{list-style:none;margin:0;padding:0}
.menu li button{width:100%;display:flex;align-items:center;gap:12px;padding:14px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;text-align:left;cursor:pointer}
.menu li button b{display:block}
.menu li button small{color:var(--muted)}

<script>
'use strict';
/* =====================================================================
   CORTE · núcleo de cálculo (sin DOM). Se usa en la app y en las pruebas.
   Fechas: cadenas 'AAAA-MM-DD'; la aritmética se hace en días UTC.
   ===================================================================== */
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESES_LARGOS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const TIPOS = {
  efectivo:      { nombre: 'Efectivo',       inmediato: true },
  debito:        { nombre: 'Débito',         inmediato: true },
  transferencia: { nombre: 'Transferencia',  inmediato: true },
  credito:       { nombre: 'Crédito',        inmediato: false },
  sin:           { nombre: 'Sin clasificar', inmediato: null },
};
const TIPO_DE_NOMBRE = Object.fromEntries(Object.entries(TIPOS).map(([k, v]) => [norm(v.nombre), k]));

let _hoyFijo = null;               // las pruebas fijan "hoy"
function fijarHoy(s) { _hoyFijo = s; }
function hoy() {
  if (_hoyFijo) return _hoyFijo;
  const d = new Date();
  return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate());
}
const pad = n => String(n).padStart(2, '0');
function ymNorm(y, m) { const t = y * 12 + (m - 1); return { y: Math.floor(t / 12), m: ((t % 12) + 12) % 12 + 1 }; }
function diasMes(y, m) { const n = ymNorm(y, m); return new Date(Date.UTC(n.y, n.m, 0)).getUTCDate(); }
function ymd(y, m, d) { const t = new Date(Date.UTC(y, m - 1, d)); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); }
function partes(s) { const [y, m, d] = s.split('-').map(Number); return { y, m, d }; }
function dn(s) { const p = partes(s); return Math.round(Date.UTC(p.y, p.m - 1, p.d) / 864e5); }
function deDn(n) { const t = new Date(n * 864e5); return ymd(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); }
function sumarDias(s, n) { return deDn(dn(s) + n); }
/** Fecha con el día limitado al último día del mes (meses cortos). */
function fechaAjustada(y, m, d) { const n = ymNorm(y, m); return ymd(n.y, n.m, Math.min(d, diasMes(n.y, n.m))); }
function sumarMeses(s, k) { const p = partes(s); return fechaAjustada(p.y, p.m + k, p.d); }
function esFecha(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(dn(s)); }
function fechaCorta(s, conAnio) { const p = partes(s); return p.d + ' ' + MESES[p.m - 1] + (conAnio ? ' ' + p.y : ''); }

/* ---------- Periodo del presupuesto (por defecto 16 → 15) ---------- */
function periodoDe(fecha, ini) {
  const p = partes(fecha);
  return p.d >= ini ? fechaAjustada(p.y, p.m, ini) : fechaAjustada(p.y, p.m - 1, ini);
}
function finPeriodo(inicio) { return sumarDias(sumarMeses(inicio, 1), -1); }
function periodoAnterior(inicio) { return sumarMeses(inicio, -1); }
function periodoSiguiente(inicio) { return sumarMeses(inicio, 1); }
function etiquetaPeriodo(inicio, conAnio = true) {
  const a = partes(inicio), b = partes(finPeriodo(inicio));
  return `${a.d} ${MESES[a.m - 1]} – ${b.d} ${MESES[b.m - 1]}` + (conAnio ? ' ' + b.y : '');
}

/* ---------- Ciclos de corte por tarjeta ---------- */
/** Fecha de corte del ciclo al que pertenece un cargo: si día ≤ corte → corte de ese mes; si no, del siguiente. */
function corteDeCargo(fecha, diaCorte) {
  const p = partes(fecha);
  const esteMes = fechaAjustada(p.y, p.m, diaCorte);
  return p.d <= partes(esteMes).d ? esteMes : fechaAjustada(p.y, p.m + 1, diaCorte);
}
function corteMas(corte, diaCorte, k) { const p = partes(corte); return fechaAjustada(p.y, p.m + k, diaCorte); }
function inicioCiclo(corte, diaCorte) { return sumarDias(corteMas(corte, diaCorte, -1), 1); }
/** Fecha límite de pago de un corte. Regla 'dias': N días después del corte. Regla 'fijo': día X del mes siguiente al corte. */
function fechaPagoDeCorte(corte, t) {
  if (t.reglaPago === 'fijo') { const p = partes(corte); return fechaAjustada(p.y, p.m + 1, +t.diaPago || 1); }
  return sumarDias(corte, +t.diasPago || 0);
}
function describirReglaPago(t) {
  return t.reglaPago === 'fijo' ? `día ${t.diaPago} del mes siguiente` : `${t.diasPago} días después del corte`;
}

/* ---------- Estado vacío y categorías de la plantilla ---------- */
const CATEGORIAS_PLANTILLA = [
  ['Vivienda', ['Renta°','Hipoteca°','Impuestos a la vivienda°','Reparaciones y mantenimiento°','Costos de asociación°']],
  ['Alimentación', ['Despensa°','Restaurantes y otros']],
  ['Caridad', ['Impuestos°','Donaciones y ofrendas']],
  ['Transporte', ['Gasolina y aceite°','Reparaciones y llantas°','Licencia e impuestos°','Estacionamiento y casetas°','Transporte público y taxis°']],
  ['Seguros', ['Vida','Gastos Médicos','Casa (inmueble y/o contenidos)','Auto','Discapacidad','Robo','Cuidado a largo plazo']],
  ['Ahorros', ['Fondo de emergencias','Fondo para el retiro','Fondo para la educación']],
  ['Servicios', ['Electricidad°','Gas°','Agua°','Recolección de residuos°','Celular°','Internet°','Cable']],
  ['Salud', ['Medicamentos°','Doctor°','Dentista°','Oculista°','Vitaminas°','Suministros médicos°','Otros gastos de salud°']],
  ['Vestimenta', ['Adultos°','Niños°','Limpieza°']],
  ['Recreación', ['Entretenimiento','Vacaciones']],
  ['Personal', ['Cuidado de niños°','Artículos de aseo personal°','Cosméticos y aseo del cabello°','Educación','Libros y utencilios','Pensión alimenticia','Manutención de hijos','Subscripciones','Costos de organización','Regalos','Reemplazo de muebles','Dinero de bolsillo 1','Dinero de bolsillo 2','Suministros para bebé','Suministros para mascotas','Musica y tecnología','Varios','Contador','Otros gastos personales 1','Otros gastos personales 2']],
  ['Deuda', ['Crédito automotriz 1','Crédito automotriz 2','Tarjeta de crédito 1','Tarjeta de crédito 2','Tarjeta de crédito 3','Tarjeta de crédito 4','Tarjeta de crédito 5','Crédito de estudio 1','Crédito de estudio 2','Crédito de estudio 3','Crédito de estudio 4','Crédito personal 1','Crédito personal 2','Otra deuda 1','Otra deuda 2','Otra deuda 3']],
];
let _sec = 0;
function nuevoId(pref = 'x') {
  const r = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10);
  return pref + Date.now().toString(36) + (_sec++).toString(36) + r;
}
function categoriasIniciales() {
  return CATEGORIAS_PLANTILLA.map(([nombre, subs]) => ({
    id: nuevoId('c'), nombre, oculta: false,
    subs: subs.map(s => ({ id: nuevoId('s'), nombre: s.replace(/°/g, '').trim(), necesario: s.includes('°'), presupuesto: 0, oculta: false })),
  }));
}
function estadoVacio() {
  return {
    v: 1,
    config: { diaInicio: 16, convDias: 365, recordatorioDias: 7, ultimoRespaldo: null, tema: 'auto',
              ultimoTipo: 'debito', ultimaCuenta: {}, creado: hoy() },
    categorias: categoriasIniciales(),
    bolsas: [ { id: nuevoId('b'), nombre: 'Efectivo', tipo: 'efectivo', oculta: false },
              { id: nuevoId('b'), nombre: 'Débito', tipo: 'debito', oculta: false } ],
    tarjetas: [], gastos: [], ingresos: [], ingresoConstante: [], pagos: [], inversiones: [],
  };
}

/* ---------- Búsquedas ---------- */
function norm(s) { return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/°/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
function porId(lista, id) { return lista.find(x => x.id === id); }
function catDe(st, id) { return porId(st.categorias, id); }
function subDe(st, catId, subId) { const c = catDe(st, catId); return c ? porId(c.subs, subId) : undefined; }
function nombreCat(st, g) { const c = catDe(st, g.catId); return c ? c.nombre : 'Sin categoría'; }
function nombreSub(st, g) { const s = subDe(st, g.catId, g.subId); return s ? s.nombre : '—'; }
function nombreCuenta(st, g) {
  if (g.tipo === 'credito') { const t = porId(st.tarjetas, g.tarjetaId); return t ? t.alias : 'Tarjeta'; }
  const b = porId(st.bolsas, g.cuentaId); return b ? b.nombre : '';
}
function ingresoConstanteDe(st, inicio) {
  let m = 0, cuenta = null;
  [...st.ingresoConstante].sort((a, b) => a.desde < b.desde ? -1 : 1).forEach(x => { if (x.desde <= inicio) { m = +x.monto || 0; cuenta = x.cuentaId || null; } });
  return { monto: m, cuentaId: cuenta };
}
const redondear = x => Math.round((x + Number.EPSILON) * 100) / 100;

/* ---------- Tarjetas: cargos, cortes y calendario ---------- */
/** Cada gasto a crédito genera uno o varios cargos (MSI: el monto se divide entre N cortes consecutivos). */
function cargosDeTarjeta(st, t) {
  const out = [];
  st.gastos.forEach(g => {
    if (g.tipo !== 'credito' || g.tarjetaId !== t.id) return;
    const n = Math.max(1, +g.msi || 1);
    const c0 = corteDeCargo(g.fecha, t.corte);
    for (let i = 0; i < n; i++) out.push({ corte: corteMas(c0, t.corte, i), monto: g.monto / n, gasto: g, cuota: i + 1, de: n });
  });
  return out;
}
/** Estado de una tarjeta a la fecha h. Los pagos se aplican a los cortes más antiguos primero (FIFO). */
function estadoTarjeta(st, t, h = hoy()) {
  const cargos = cargosDeTarjeta(st, t);
  const mapa = new Map();
  const corteAbierto = corteDeCargo(h, t.corte);          // ciclo que incluye hoy (el día de corte aún está abierto)
  const ultimoCerrado = corteMas(corteAbierto, t.corte, -1);
  mapa.set(corteAbierto, 0); mapa.set(ultimoCerrado, 0);
  cargos.forEach(c => mapa.set(c.corte, (mapa.get(c.corte) || 0) + c.monto));
  const pagos = st.pagos.filter(p => p.tarjetaId === t.id && p.fecha <= h);
  const totalPagos = pagos.reduce((a, p) => a + p.monto, 0);
  let resto = totalPagos;
  const cortes = [...mapa.keys()].sort().map(k => {
    const monto = mapa.get(k), aplicado = Math.min(resto, monto); resto -= aplicado;
    return { corte: k, inicio: inicioCiclo(k, t.corte), fechaPago: fechaPagoDeCorte(k, t), monto, pagado: aplicado,
             pendiente: monto - aplicado, cerrado: k < h };
  });
  const totalCargos = cargos.reduce((a, c) => a + c.monto, 0);
  const pendientes = cortes.filter(c => c.cerrado && c.pendiente > 0.005);
  const abierto = cortes.find(c => c.corte === corteAbierto);
  let proximo;
  if (pendientes.length) {
    const c = pendientes[0];
    proximo = { fecha: c.fechaPago, monto: c.pendiente, corte: c.corte, vencido: c.fechaPago < h, cerrado: true };
  } else {
    proximo = { fecha: abierto.fechaPago, monto: 0, corte: abierto.corte, vencido: false, cerrado: false };
  }
  proximo.dias = dn(proximo.fecha) - dn(h);
  const saldo = totalCargos - totalPagos;
  return {
    tarjeta: t, cortes, cargos, pagos, proximo, corteAbierto, ultimoCerrado,
    acumuladoAbierto: abierto.pendiente,                    // lo que lleva el ciclo abierto (neto de pagos anticipados)
    pendienteCerrado: pendientes.reduce((a, c) => a + c.pendiente, 0),
    saldo, aFavor: resto > 0.005 ? resto : 0,
    utilizado: t.limite > 0 ? Math.max(0, saldo) / t.limite : null,
  };
}

/* ---------- Inversiones con interés compuesto diario ---------- */
function tasaDiaria(inv, conv) {
  const r = (+inv.tasa || 0) / 100;
  return inv.tipoTasa === 'gat' ? Math.pow(1 + r, 1 / conv) - 1 : r / conv;
}
const _seriesCache = new Map();
function limpiarCache() { _seriesCache.clear(); }
/**
 * Serie diaria: cada día el saldo de cierre del día anterior gana saldo × tasa diaria (se capitaliza),
 * después se aplican los movimientos del día (un depósito empieza a ganar al día siguiente).
 */
function serieInversion(inv, conv, hasta = hoy()) {
  const clave = inv.id + '|' + conv + '|' + hasta + '|' + inv.tasa + '|' + inv.tipoTasa + '|' + JSON.stringify(inv.movs);
  if (_seriesCache.has(clave)) return _seriesCache.get(clave);
  const movs = [...inv.movs].filter(m => m.fecha <= hasta).sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.orden || 0) - (b.orden || 0));
  if (!movs.length) { const r = null; _seriesCache.set(clave, r); return r; }
  const rd = tasaDiaria(inv, conv), d0 = dn(movs[0].fecha), d1 = dn(hasta), n = d1 - d0 + 1;
  const saldo = new Float64Array(n), interes = new Float64Array(n), ajustes = [];
  let B = 0, k = 0;
  for (let i = 0; i < n; i++) {
    const int = B * rd; B += int; interes[i] = int;
    while (k < movs.length && dn(movs[k].fecha) === d0 + i) {
      const m = movs[k++];
      if (m.tipo === 'retiro') B -= m.monto;
      else if (m.tipo === 'ajuste') { ajustes.push({ fecha: m.fecha, delta: m.monto - B }); B = m.monto; }
      else if (m.tipo === 'ajusteDif') { ajustes.push({ fecha: m.fecha, delta: m.monto }); B += m.monto; }
      else B += m.monto;                                   // 'inicial' y 'deposito'
    }
    saldo[i] = B;
  }
  const r = { d0, rd, saldo, interes, ajustes, ultimaFecha: movs[movs.length - 1].fecha };
  _seriesCache.set(clave, r); return r;
}
function saldoEn(serie, fecha) { if (!serie) return 0; const i = dn(fecha) - serie.d0; return i < 0 ? 0 : serie.saldo[Math.min(i, serie.saldo.length - 1)]; }
function interesEntre(serie, desde, hasta) {
  if (!serie) return 0;
  const a = Math.max(0, dn(desde) - serie.d0), b = Math.min(serie.saldo.length - 1, dn(hasta) - serie.d0);
  let s = 0; for (let i = a; i <= b; i++) s += serie.interes[i]; return s;
}
function resumenInversion(st, inv, inicioP, h = hoy()) {
  const conv = st.config.convDias, s = serieInversion(inv, conv, h), rd = tasaDiaria(inv, conv);
  const saldo = saldoEn(s, h), finP = finPeriodo(inicioP);
  const proy = k => saldo * Math.pow(1 + rd, dn(sumarMeses(h, k)) - dn(h));
  return {
    inv, rd, saldo,
    interesHoy: s ? s.interes[s.interes.length - 1] : 0,
    interesPeriodo: inicioP <= h ? interesEntre(s, inicioP, finP < h ? finP : h) : 0,
    interesTotal: s ? interesEntre(s, deDn(s.d0), h) : 0,
    ajustes: s ? s.ajustes.reduce((a, x) => a + x.delta, 0) : 0,
    proy1: proy(1), proy6: proy(6), proy12: proy(12),
    serie: s,
  };
}

/* ---------- Resumen de un periodo ---------- */
function resumenPeriodo(st, inicio, h = hoy()) {
  const fin = finPeriodo(inicio), dentro = f => f >= inicio && f <= fin;
  const gastos = st.gastos.filter(g => dentro(g.fecha));
  const porTipo = { efectivo: 0, debito: 0, transferencia: 0, credito: 0, sin: 0 };
  const porBolsa = {}, porCat = {}, porTarjeta = {};
  let necesarios = 0;
  gastos.forEach(g => {
    porTipo[g.tipo] = (porTipo[g.tipo] || 0) + g.monto;
    if (g.tipo !== 'credito' && g.tipo !== 'sin' && g.cuentaId) porBolsa[g.cuentaId] = (porBolsa[g.cuentaId] || 0) + g.monto;
    const pc = porCat[g.catId] || (porCat[g.catId] = { total: 0, subs: {} });
    pc.total += g.monto; pc.subs[g.subId] = (pc.subs[g.subId] || 0) + g.monto;
    if (g.tipo === 'credito') {

function periodosConDatos(st, ini) {
  const fechas = [...st.gastos.map(g => g.fecha), ...st.ingresos.map(i => i.fecha), ...st.pagos.map(p => p.fecha)];
  const actual = periodoDe(hoy(), ini);
  let primero = actual;
  fechas.forEach(f => { const p = periodoDe(f, ini); if (p < primero) primero = p; });
  let ultimo = actual;
  fechas.forEach(f => { const p = periodoDe(f, ini); if (p > ultimo) ultimo = p; });
  const out = []; for (let p = primero; p <= ultimo; p = periodoSiguiente(p)) out.push(p);
  return out.reverse();

const H_RES = 'Resumen', H_GAS = 'Gastos', H_ING = 'Ingresos', H_PAG = "'Pagos de tarjeta'", H_TAR = 'Tarjetas', H_INV = 'Inversiones', H_CAT = "'Categorías'", H_LIS = 'Listas';
const TIPO_TASA_XL = { nominal: 'Nominal (capitalización diaria)', gat: 'GAT / efectiva anual' };
const REGLA_XL = { dias: 'Días después del corte', fijo: 'Día fijo del mes siguiente' };
const MOV_XL = { inicial: 'Saldo inicial', deposito: 'Depósito', retiro: 'Retiro', ajusteDif: 'Ajuste (diferencia)' };

function construirLibro(st, opciones = {}) {
  const h = hoy();
  const nG = Math.max(1000, st.gastos.length + 500), RG = nG + 1;     // última fila de Gastos
  const RI = Math.max(300, st.ingresos.length + 200) + 1;
  const RP = Math.max(300, st.pagos.length + 200) + 1;
  const RT = 51, RV = 21;                                              // tarjetas: filas 2..51, inversiones 2..21
  const rg = c => `${H_GAS}!$${c}$2:$${c}$${RG}`, ri = c => `${H_ING}!$${c}$2:$${c}$${RI}`, rp = c => `${H_PAG}!$${c}$2:$${c}$${RP}`, rt = c => `${H_TAR}!$${c}$2:$${c}$${RT}`;
  const HOY = `${H_RES}!$C$4`, INI = `${H_RES}!$C$5`, CONV = `${H_RES}!$C$6`, PINI = `${H_RES}!$C$8`, PFIN = `${H_RES}!$C$9`, PANT = `${H_RES}!$D$8`;
  const periodoF = a => `IF(${a}="","",IF(DAY(${a})>=${INI},DATE(YEAR(${a}),MONTH(${a}),${INI}),DATE(YEAR(${a}),MONTH(${a})-1,${INI})))`;

  /* ---- Listas ---- */
  const lis = new Hoja('Listas');
  const cats = st.categorias;
  lis.fila(1, 0, ['Categorías', 'Tipos de pago', 'Cuentas / bolsas (efectivo, débito)', 'Reglas de pago', 'Tipos de tasa', 'Movimientos de inversión', 'Sí/No'], E.encabezado);
  cats.forEach((c, i) => lis.set('A' + (i + 2), c.nombre));
  Object.values(TIPOS).forEach((t, i) => lis.set('B' + (i + 2), t.nombre));
  st.bolsas.forEach((b, i) => lis.set('C' + (i + 2), b.nombre, E.inTexto));
  Object.values(REGLA_XL).forEach((t, i) => lis.set('D' + (i + 2), t));
  Object.values(TIPO_TASA_XL).forEach((t, i) => lis.set('E' + (i + 2), t));
  Object.values(MOV_XL).forEach((t, i) => lis.set('F' + (i + 2), t));
  lis.fila(2, 6, ['Sí']); lis.fila(3, 6, ['No']);
  lis.set('H1', 'Cuentas y tarjetas (desplegable de Gastos)', E.encabezado);
  for (let i = 0; i < 39; i++) lis.set('H' + (i + 2), { f: `IF(C${i + 2}="","",C${i + 2})` });
  for (let i = 0; i < 50; i++) lis.set('H' + (i + 41), { f: `IF(${H_TAR}!A${i + 2}="","",${H_TAR}!A${i + 2})` });
  lis.set('J1', 'Puedes agregar cuentas/bolsas en la columna C (filas 2–40). La columna H se llena sola.', E.nota);
  lis.ancho([22, 16, 34, 26, 30, 24, 8]);

  /* ---- Categorías (presupuesto vs gastado) ---- */
  const cat = new Hoja('Categorías');
  cat.fila(1, 0, ['Categoría', 'Subcategoría', 'Necesario (°)', 'Oculta', 'Estilo de vida (presupuesto)', 'Gastado (periodo)', 'Diferencia', '% usado', 'Gastado periodo anterior'], E.encabezado);
  let r = 2;
  cats.forEach(c => c.subs.forEach(s => {
    cat.fila(r, 0, [c.nombre, s.nombre, s.necesario ? 'Sí' : 'No', (c.oculta || s.oculta) ? 'Sí' : 'No'], [E.inTexto, E.inTexto, E.inTexto, E.inTexto]);
    cat.set('E' + r, +s.presupuesto || 0, E.inDinero);
    cat.set('F' + r, { f: `SUMIFS(${rg('C')},${rg('D')},$A${r},${rg('E')},$B${r},${rg('J')},${PINI})` }, E.dinero);
    cat.set('G' + r, { f: `E${r}-F${r}` }, E.dinero);
    cat.set('H' + r, { f: `IF(E${r}>0,F${r}/E${r},"")` }, E.pct);
    cat.set('I' + r, { f: `SUMIFS(${rg('C')},${rg('D')},$A${r},${rg('E')},$B${r},${rg('J')},${PANT})` }, E.dinero);
    r++;
  }));
  const RC = Math.max(r - 1, 2);
  cat.congelar = 'C2'; cat.filtro = `A1:I${RC}`;
  cat.ancho([18, 32, 13, 9, 16, 16, 14, 10, 16]);
  cat.formatos.push({ rango: `G2:G${RC}`, reglas: [{ f: 'G2<0', dxf: 0 }] }, { rango: `H2:H${RC}`, reglas: [{ f: 'AND(ISNUMBER(H2),H2>1)', dxf: 0 }, { f: 'AND(ISNUMBER(H2),H2>=0.85)', dxf: 1 }] });
  cat.validaciones.push({ rango: `C2:D${RC + 50}`, f: `${H_LIS}!$G$2:$G$3` }, { rango: `A2:A${RC + 50}`, f: `${H_LIS}!$A$2:$A$40` });

  /* ---- Gastos ---- */
  const gas = new Hoja('Gastos');
  gas.fila(1, 0, ['Fecha', 'Concepto', 'Monto', 'Categoría', 'Subcategoría', 'Tipo de pago', 'Tarjeta / cuenta', 'MSI (meses)', 'Nota',
    'Periodo (inicio)', 'Inmediato / Diferido', 'Día de corte', 'Corte del ciclo', 'Fecha límite de pago', 'Meses (aux)', 'Índice mes corte (aux)', 'Subcat. válida (aux)', 'Cuenta válida (aux)'], E.encabezado);
  const gastos = [...st.gastos].sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  for (let i = 0; i < nG; i++) {
    const R = i + 2, g = gastos[i];
    if (g) {
      gas.set('A' + R, { d: g.fecha }, E.inFecha).set('B' + R, g.concepto || '', E.inTexto).set('C' + R, g.monto, E.inDinero)
        .set('D' + R, nombreCat(st, g), E.inTexto).set('E' + R, nombreSub(st, g), E.inTexto).set('F' + R, TIPOS[g.tipo].nombre, E.inTexto)
        .set('G' + R, nombreCuenta(st, g), E.inTexto).set('H' + R, g.tipo === 'credito' && g.msi > 1 ? +g.msi : null, E.inEntero).set('I' + R, g.nota || '', E.inTexto);
    }
    gas.set('J' + R, { f: periodoF('A' + R) }, E.fecha);
    gas.set('K' + R, { f: `IF(A${R}="","",IF(F${R}="Crédito","Diferido",IF(OR(F${R}="Efectivo",F${R}="Débito",F${R}="Transferencia"),"Inmediato","Sin clasificar")))` });
    gas.set('L' + R, { f: `IF(F${R}="Crédito",IFERROR(INDEX(${rt('D')},MATCH(G${R},${rt('A')},0)),""),"")` }, E.entero);
    gas.set('M' + R, { f: `IF(OR(A${R}="",L${R}=""),"",IF(DAY(A${R})<=MIN(L${R},DAY(EOMONTH(A${R},0))),DATE(YEAR(A${R}),MONTH(A${R}),MIN(L${R},DAY(EOMONTH(A${R},0)))),DATE(YEAR(A${R}),MONTH(A${R})+1,MIN(L${R},DAY(EOMONTH(A${R},1))))))` }, E.fecha);
    gas.set('N' + R, { f: `IF(M${R}="","",IF(INDEX(${rt('E')},MATCH(G${R},${rt('A')},0))="${REGLA_XL.fijo}",DATE(YEAR(M${R}),MONTH(M${R})+1,MIN(INDEX(${rt('F')},MATCH(G${R},${rt('A')},0)),DAY(EOMONTH(M${R},1)))),M${R}+INDEX(${rt('F')},MATCH(G${R},${rt('A')},0))))` }, E.fecha);
    gas.set('O' + R, { f: `IF(M${R}="",1,IF(ISNUMBER(H${R}),MAX(1,H${R}),1))` }, E.entero);
    gas.set('P' + R, { f: `IF(M${R}="",0,YEAR(M${R})*12+MONTH(M${R}))` }, E.entero);
    gas.set('Q' + R, { f: `IF(E${R}="",1,COUNTIFS(${H_CAT}!$A$2:$A$${RC + 50},D${R},${H_CAT}!$B$2:$B$${RC + 50},E${R}))` }, E.entero);
    gas.set('R' + R, { f: `IF(G${R}="",1,IF(F${R}="Crédito",COUNTIF(${rt('A')},G${R}),COUNTIF(${H_LIS}!$C$2:$C$40,G${R})))` }, E.entero);
  }
  gas.congelar = 'C2'; gas.filtro = `A1:R${RG}`;
  gas.ancho([12, 30, 12, 16, 26, 14, 18, 8, 20, 14, 14, 9, 13, 13, 7, 9, 9, 9]);
  gas.validaciones.push(
    { rango: `D2:D${RG}`, f: `${H_LIS}!$A$2:$A$40`, titulo: 'Categoría', error: 'Elige una categoría de la lista (hoja Categorías).' },
    { rango: `E2:E${RG}`, f: `${H_CAT}!$B$2:$B$${RC + 50}`, titulo: 'Subcategoría', error: 'Elige una subcategoría de la hoja Categorías.' },
    { rango: `F2:F${RG}`, f: `${H_LIS}!$B$2:$B$6`, titulo: 'Tipo de pago', error: 'Efectivo, Débito, Transferencia, Crédito o Sin clasificar.' },
    { rango: `G2:G${RG}`, f: `${H_LIS}!$H$2:$H$100`, titulo: 'Tarjeta / cuenta', error: 'Si es Crédito elige una tarjeta; si no, una cuenta o bolsa.' },
    { rango: `C2:C${RG}`, tipo: 'decimal', op: 'greaterThanOrEqual', f: '0', titulo: 'Monto', error: 'El monto debe ser un número positivo.' },
    { rango: `H2:H${RG}`, tipo: 'whole', op: 'between', f: '1', f2: '48', titulo: 'MSI', error: 'Número de meses entre 1 y 48.' });
  gas.formatos.push({ rango: `K2:K${RG}`, reglas: [{ f: 'K2="Diferido"', dxf: 1 }, { f: 'K2="Sin clasificar"', dxf: 0 }] },
    { rango: `E2:E${RG}`, reglas: [{ f: 'AND($E2<>"",$Q2=0)', dxf: 0 }] },
    { rango: `G2:G${RG}`, reglas: [{ f: 'AND($G2<>"",$R2=0)', dxf: 0 }] });

  /* ---- Ingresos ---- */
  const ing = new Hoja('Ingresos');
  ing.fila(1, 0, ['Fecha', 'Concepto', 'Monto', 'Cuenta / bolsa', 'Periodo (inicio)', '', 'Ingreso constante desde (inicio de periodo)', 'Monto constante', 'Cuenta / bolsa'], [E.encabezado, E.encabezado, E.encabezado, E.encabezado, E.encabezado, 0, E.encabezado, E.encabezado, E.encabezado]);
  const ingresos = [...st.ingresos].sort((a, b) => a.fecha < b.fecha ? -1 : 1);
  for (let i = 0; i < RI - 1; i++) {
    const R = i + 2, x = ingresos[i];
    if (x) ing.set('A' + R, { d: x.fecha }, E.inFecha).set('B' + R, x.concepto || '', E.inTexto).set('C' + R, x.monto, E.inDinero).set('D' + R, (porId(st.bolsas, x.cuentaId) || {}).nombre || '', E.inTexto);
    ing.set('E' + R, { f: periodoF('A' + R) }, E.fecha);
  }
  [...st.ingresoConstante].sort((a, b) => a.desde < b.desde ? -1 : 1).forEach((x, i) => {
    ing.set('G' + (i + 2), { d: x.desde }, E.inFecha).set('H' + (i + 2), +x.monto || 0, E.inDinero).set('I' + (i + 2), (porId(st.bolsas, x.cuentaId) || {}).nombre || '', E.inTexto);
  });
  ing.set('G14', 'El ingreso constante aplica desde el periodo indicado hasta la siguiente fila. Mantén las filas G2:G12 en orden de fecha ascendente y escribe la fecha de inicio del periodo (ej. 16/09/2026).', E.nota);
  ing.congelar = 'A2'; ing.ancho([12, 30, 12, 18, 14, 3, 22, 14, 16]);
  ing.validaciones.push({ rango: `D2:D${RI}`, f: `${H_LIS}!$C$2:$C$40` }, { rango: 'I2:I12', f: `${H_LIS}!$C$2:$C$40` });

  /* ---- Pagos de tarjeta ---- */
  const pag = new Hoja('Pagos de tarjeta');
  pag.fila(1, 0, ['Fecha', 'Tarjeta', 'Monto', 'Cuenta de origen', 'Nota', 'Periodo (inicio)'], E.encabezado);
  const pagos = [...st.pagos].sort((a, b) => a.fecha < b.fecha ? -1 : 1);
  for (let i = 0; i < RP - 1; i++) {
    const R = i + 2, p = pagos[i];
    if (p) pag.set('A' + R, { d: p.fecha }, E.inFecha).set('B' + R, (porId(st.tarjetas, p.tarjetaId) || {}).alias || '', E.inTexto).set('C' + R, p.monto, E.inDinero)
      .set('D' + R, (porId(st.bolsas, p.cuentaId) || {}).nombre || '', E.inTexto).set('E' + R, p.nota || '', E.inTexto);
    pag.set('F' + R, { f: periodoF('A' + R) }, E.fecha);
  }
  pag.set('H1', 'Un pago de tarjeta NO es un gasto: liquida deuda y descuenta del dinero disponible.', E.nota);
  pag.congelar = 'A2'; pag.ancho([12, 18, 12, 18, 26, 14]);
  pag.validaciones.push({ rango: `B2:B${RP}`, f: rt('A') }, { rango: `D2:D${RP}`, f: `${H_LIS}!$C$2:$C$40` });

  /* ---- Tarjetas ---- */
  const tar = new Hoja('Tarjetas');
  tar.fila(1, 0, ['Alias', 'Banco', 'Últimos 4', 'Día de corte', 'Regla de pago', 'Días / día de pago', 'Límite de crédito', 'Para qué la uso',
    'Último corte', 'Próximo corte', 'Pago del último corte', 'Pago del próximo corte', 'Monto del último corte', 'Pagado desde el último corte',
    'Pendiente del último corte', 'Próxima fecha de pago', 'Días restantes', 'Ciclo abierto (acumulado)', 'Saldo total por pagar', '% utilizado'], E.encabezado);
  const estado = (X, R) => `IF($A${R}="",0,SUMPRODUCT((${rg('G')}=$A${R})*(${rg('F')}="Crédito")*((YEAR(${X})*12+MONTH(${X})-${rg('P')})>=0)*((YEAR(${X})*12+MONTH(${X})-${rg('P')})<${rg('O')})*${rg('C')}/${rg('O')}))`;
  const pagoDe = (X, R) => `IF(${X}="","",IF($E${R}="${REGLA_XL.fijo}",DATE(YEAR(${X}),MONTH(${X})+1,MIN($F${R},DAY(EOMONTH(${X},1)))),${X}+$F${R}))`;
  for (let i = 0; i < RT - 1; i++) {
    const R = i + 2, t = st.tarjetas[i];
    if (t) tar.set('A' + R, t.alias, E.inTexto).set('B' + R, t.banco || '', E.inTexto).set('C' + R, t.ult4 || '', E.inTexto).set('D' + R, +t.corte, E.inEntero)
      .set('E' + R, REGLA_XL[t.reglaPago] || REGLA_XL.dias, E.inTexto).set('F' + R, t.reglaPago === 'fijo' ? +t.diaPago : +t.diasPago, E.inEntero)
      .set('G' + R, t.limite ? +t.limite : null, E.inDinero).set('H' + R, t.uso || '', E.inTexto);
    else if (i < 10) tar.set('A' + R, null, E.inTexto).set('D' + R, null, E.inEntero);
    tar.set('I' + R, { f: `IF($D${R}="","",IF(DAY(${HOY})>MIN($D${R},DAY(EOMONTH(${HOY},0))),DATE(YEAR(${HOY}),MONTH(${HOY}),MIN($D${R},DAY(EOMONTH(${HOY},0)))),DATE(YEAR(${HOY}),MONTH(${HOY})-1,MIN($D${R},DAY(EOMONTH(${HOY},-1))))))` }, E.fecha);
    tar.set('J' + R, { f: `IF($D${R}="","",DATE(YEAR(I${R}),MONTH(I${R})+1,MIN($D${R},DAY(EOMONTH(I${R},1)))))` }, E.fecha);
    tar.set('K' + R, { f: pagoDe('I' + R, R) }, E.fecha);
    tar.set('L' + R, { f: pagoDe('J' + R, R) }, E.fecha);
    tar.set('M' + R, { f: `IF($D${R}="","",${estado('I' + R, R)})` }, E.dinero);
    tar.set('N' + R, { f: `IF($D${R}="","",SUMIFS(${rp('C')},${rp('B')},$A${R},${rp('A')},">"&I${R},${rp('A')},"<="&${HOY}))` }, E.dinero);
    tar.set('O' + R, { f: `IF($D${R}="","",MAX(0,M${R}-N${R}))` }, E.dinero);
    tar.set('P' + R, { f: `IF($D${R}="","",IF(O${R}>0.005,K${R},L${R}))` }, E.fecha);
    tar.set('Q' + R, { f: `IF($D${R}="","",P${R}-${HOY})` }, E.entero);
    tar.set('R' + R, { f: `IF($D${R}="","",MAX(0,${estado('J' + R, R)}-MAX(0,N${R}-M${R})))` }, E.dinero);
    tar.set('S' + R, { f: `IF($A${R}="","",SUMIFS(${rg('C')},${rg('G')},$A${R},${rg('F')},"Crédito")-SUMIFS(${rp('C')},${rp('B')},$A${R}))` }, E.dinero);
    tar.set('T' + R, { f: `IF(AND(ISNUMBER($G${R}),$G${R}>0),MAX(0,S${R})/$G${R},"")` }, E.pct);
  }
  tar.set('A54', 'Por seguridad NO captures el número completo, CVV ni vencimiento. Rojo = pago vencido; amarillo = vence en 5 días o menos.', E.nota);
  tar.congelar = 'B2'; tar.ancho([16, 14, 9, 9, 24, 10, 13, 28, 13, 13, 13, 13, 14, 14, 14, 14, 9, 14, 14, 10]);
  tar.formatos.push({ rango: `P2:Q${RT}`, reglas: [{ f: `AND($D2<>"",$O2>0.005,$Q2<0)`, dxf: 0 }, { f: `AND($D2<>"",$O2>0.005,$Q2>=0,$Q2<=5)`, dxf: 1 }] },
                    { rango: `T2:T${RT}`, reglas: [{ f: 'AND(ISNUMBER(T2),T2>=0.8)', dxf: 0 }] });
  tar.validaciones.push({ rango: `E2:E${RT}`, f: `${H_LIS}!$D$2:$D$3` }, { rango: `D2:D${RT}`, tipo: 'whole', op: 'between', f: '1', f2: '31', titulo: 'Día de corte', error: 'Día entre 1 y 31.' },
                        { rango: `C2:C${RT}`, tipo: 'textLength', op: 'lessThanOrEqual', f: '4', titulo: 'Solo 4 dígitos', error: 'Captura solo los últimos 4 dígitos.' });

  /* ---- Inversiones (todo se calcula desde el historial de movimientos) ---- */
  // saldo(t) = Σ efecto_m × (1 + tasa diaria)^(t − fecha_m), para cada movimiento con fecha ≤ t (capitalización diaria exacta)
  const MV = "'Mov. inversiones'", RM = 501;
  const mv = c => `${MV}!$${c}$2:$${c}$${RM}`;
  const HOYN = `${H_RES}!$E$4`, ININ = `${H_RES}!$E$8`, FINN = `${H_RES}!$E$9`;
  const saldoF = (R, t, conExp) => `SUMPRODUCT((${mv('A')}=$A${R})*(${mv('F')}<=${t})*${mv('E')}*${conExp ? `EXP((${t}-${mv('F')})*LN(1+$E${R}))` : `(1+$E${R})^(${t}-${mv('F')})`})`;
  const inv = new Hoja('Inversiones');
  inv.fila(1, 0, ['Cuenta', 'Institución', 'Tipo de tasa', 'Tasa anual', 'Tasa diaria', 'Saldo hoy', 'Interés ganado hoy', 'Interés en el periodo',
    'Interés total acumulado', 'Proyección 1 mes', 'Proyección 6 meses', 'Proyección 12 meses', 'Verificación independiente'], E.encabezado);
  const movsXl = [];
  for (let i = 0; i < RV - 1; i++) {
    const R = i + 2, x = st.inversiones[i];
    if (x) {
      inv.set('A' + R, x.nombre, E.inTexto).set('B' + R, x.institucion || '', E.inTexto).set('C' + R, TIPO_TASA_XL[x.tipoTasa] || TIPO_TASA_XL.nominal, E.inTexto).set('D' + R, (+x.tasa || 0) / 100, E.inPct);
      const s = serieInversion(x, st.config.convDias, h), aj = s ? [...s.ajustes] : [];
      [...x.movs].sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.orden || 0) - (b.orden || 0)).forEach(m => {
        if (m.tipo === 'ajuste') { const a = aj.shift(); movsXl.push([x.nombre, m.fecha, MOV_XL.ajusteDif, a ? redondear(a.delta * 1e4) / 1e4 : 0, (m.nota ? m.nota + ' · ' : '') + `saldo real ${m.monto}`]); }
        else movsXl.push([x.nombre, m.fecha, MOV_XL[m.tipo] || MOV_XL.deposito, m.monto, m.nota || '']);
      });
    }
    const vacio = `$A${R}=""`;
    inv.set('E' + R, { f: `IF(${vacio},"",IF($C${R}="${TIPO_TASA_XL.gat}",(1+$D${R})^(1/${CONV})-1,$D${R}/${CONV}))` }, E.pctDiario);
    inv.set('F' + R, { f: `IF(${vacio},"",${saldoF(R, HOYN)})` }, E.dinero);
    inv.set('G' + R, { f: `IF(${vacio},"",F${R}-${saldoF(R, HOYN + '-1')}-SUMIFS(${mv('E')},${mv('A')},$A${R},${mv('F')},${HOYN}))` }, E.dinero);
    inv.set('H' + R, { f: `IF(${vacio},"",IF(${ININ}>${FINN},0,${saldoF(R, FINN)}-${saldoF(R, ININ + '-1')}-SUMIFS(${mv('E')},${mv('A')},$A${R},${mv('F')},">="&${ININ},${mv('F')},"<="&${FINN})))` }, E.dinero);
    inv.set('I' + R, { f: `IF(${vacio},"",F${R}-SUMIFS(${mv('E')},${mv('A')},$A${R},${mv('F')},"<="&${HOYN}))` }, E.dinero);
    [['J', 1], ['K', 6], ['L', 12]].forEach(([c, m]) => inv.set(c + R, { f: `IF(${vacio},"",F${R}*(1+$E${R})^DATEDIF(${HOY},EDATE(${HOY},${m}),"D"))` }, E.dinero));
    inv.set('M' + R, { f: `IF(${vacio},"",IF(ABS(${saldoF(R, HOYN, true)}-F${R})<0.005,"OK","REVISAR"))` }, E.check);
  }

/** Adivina el inicio del periodo a partir del nombre de la hoja ("16 Sep - 15 Oct", "16 Julio - 15 Agosto 2026"). */
function adivinarPeriodoHoja(nombre, ini, h = hoy()) {
  const n = norm(nombre); let mes = null;
  for (const tok of n.split(/[^a-z0-9]+/)) { const k = tok.slice(0, 3); if (MES_TOKENS[k] && tok.length >= 3) { mes = MES_TOKENS[k]; break; } }

  if (a) return fechaAjustada(+a[1], mes, ini);
  let y = partes(h).y, p = fechaAjustada(y, mes, ini);
  if (p > h) p = fechaAjustada(y - 1, mes, ini);

}
/** Fecha "dd/mm" al final del texto → fecha completa dentro (o cerca) del periodo. */
function extraerFecha(texto, inicioP) {

  const d = +m[1], mo = +m[2]; if (d < 1 || d > 31 || mo < 1 || mo > 12) return { concepto: String(texto).trim(), fecha: null };
  const concepto = String(texto).trim().slice(0, m.index).trim();
  if (m[3]) { let y = +m[3]; if (y < 100) y += 2000; return { concepto, fecha: fechaAjustada(y, mo, d) }; }
  const y0 = partes(inicioP).y, centro = dn(inicioP) + 15;
  const cands = [y0 - 1, y0, y0 + 1].map(y => fechaAjustada(y, mo, d));
  cands.sort((a, b) => Math.abs(dn(a) - centro) - Math.abs(dn(b) - centro));
  return { concepto, fecha: cands[0] };
}

let _tGuardar = null;

}

function toast(msg, accion) {

  if (accion) t.querySelector('button').onclick = () => { accion.fn(); t.classList.remove('si'); };

}
function leerMonto(s) {
  s = String(s ?? '').replace(/[\s$]/g, '');
  if (s.includes(',') && s.includes('.')) s = s.replace(/,/g, '');
  else if (/,\d{1,2}$/.test(s) && !s.includes('.')) s = s.replace(',', '.');
  else s = s.replace(/,/g, '');
  const n = parseFloat(s); return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
}

function delta(act, ant, invertir) {
  if (!ant && !act) return '';

function graficaCategorias(r, ra) {

      <rect x="${lblW}" y="${y + 4}" width="${w}" height="12" rx="6" fill="${color}"/>
      ${x.pres > 0 ? `<rect x="${lblW + Math.min(barW, x.pres / max * barW) - 1}" y="${y}" width="2.5" height="20" rx="1" fill="var(--ink)"/>` : ''}
      ${x.ant > 0 ? `<path d="M${lblW + x.ant / max * barW} ${y + 21} l-4 5 h8z" fill="var(--s3)"/>` : ''}

/* ---------- Gastos ---------- */
function gastosFiltrados() {
  const q = norm(F.q);
  let desde = null, hasta = null;
  if (F.rango === 'periodo') { desde = P; hasta = finPeriodo(P); }
  else if (F.rango === 'rango') { desde = F.desde || null; hasta = F.hasta || null; }
  return ST.gastos.filter(g => {
    if (desde && g.fecha < desde) return false; if (hasta && g.fecha > hasta) return false;
    if (F.cat && g.catId !== F.cat) return false;
    if (F.tipo === 'inmediato' ? !TIPOS[g.tipo].inmediato : F.tipo && g.tipo !== F.tipo) return false;
    if (F.cuenta && g.cuentaId !== F.cuenta && g.tarjetaId !== F.cuenta) return false;
    if (q && !norm(g.concepto + ' ' + (g.nota || '') + ' ' + nombreSub(ST, g) + ' ' + nombreCat(ST, g)).includes(q)) return false;
    return true;
  }).sort((a, b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : (b.creado || 0) - (a.creado || 0));
}

/* ---------- Importar desde Excel / CSV ---------- */
async function importarExcel(file) {
  try {
    let hojas;
    if (/\.csv$/i.test(file.name) || file.type === 'text/csv') hojas = csvAHojas(await file.text(), file.name.replace(/\.csv$/i, ''));
    else hojas = await leerXlsx(new Uint8Array(await file.arrayBuffer()));
    if (esLibroCorte(hojas)) {
      if (!confirm('Este es un Excel exportado por Corte. ¿Reemplazar TODOS los datos de la app con los del Excel? (Te conviene exportar un respaldo antes.)')) return;
      const { st, sinFecha } = importarLibroCorte(hojas);
      st.config = Object.assign({}, ST.config, { diaInicio: st.config.diaInicio, convDias: st.config.convDias, bienvenida: true });
      ST = st; guardar(); render(); toast(`Importado: ${st.gastos.length} gastos, ${st.tarjetas.length} tarjetas${sinFecha ? ` (${sinFecha} filas sin fecha omitidas)` : ''}`); return;
    }
    if (hojas.length === 1 && norm(hojas[0].get('A1')) === 'fecha' && norm(hojas[0].get('C1')) === 'monto') {
      const n = importarCsvCorte(ST, hojas[0]); guardar(); render(); toast(`Importados ${n} gastos`); return;
    }
    const analisis = analizarPlantilla(hojas, ini());
    if (!analisis.length) { toast('No encontré columnas "Gasto" y "Cantidad" en el archivo'); return; }
    previaPlantilla(analisis);
  } catch (e) { console.error(e); toast('No se pudo leer el archivo: ' + (e.message || e)); }
}
function previaPlantilla(analisis) {
  analisis.forEach(a => { a.incluir = a.filas.some(f => f.monto > 0); });
  const total = () => analisis.filter(a => a.incluir).reduce((s, a) => s + a.filas.filter(f => f.monto > 0).length, 0);
  abrirHoja('Importar tu plantilla', `
  <form class="form" id="fimp">
    <p style="margin:0;font-size:13.5px">Encontré ${analisis.length} hoja${analisis.length > 1 ? 's' : ''} con gastos. Revisa a qué periodo corresponde cada una: la fecha <b>dd/mm</b> al final del concepto se usa para el día exacto; si falta, el gasto cae al inicio del periodo.</p>
    ${analisis.map((a, i) => `<div class="card" style="margin:0;padding:12px">
      <label class="check"><input type="checkbox" data-i="${i}" class="imp-inc" ${a.incluir ? 'checked' : ''}> ${h(a.hoja)}</label>
      <div class="fila2" style="margin-top:8px"><label>Periodo que inicia el<input type="date" class="imp-per" data-i="${i}" value="${a.periodo}"></label>
        <div style="font-size:12.5px;color:var(--muted);align-self:end">${a.filas.filter(f => f.monto > 0).length} gastos · ${$m(a.filas.reduce((s, f) => s + (f.monto > 0 ? f.monto : 0), 0))}${a.ingresoConstante || a.ingresoIrregular ? `<br>Ingresos: ${$m(a.ingresoConstante)} + ${$m(a.ingresoIrregular)}` : ''}</div></div>
      ${a.filas.some(f => norm(f.cat) === 'deuda' && /tarjeta de credito/.test(norm(f.sub))) ? '<p class="ayuda" style="margin:6px 0 0">⚠️ Tiene filas de Deuda › Tarjeta de crédito.</p>' : ''}
    </div>`).join('')}
    <label class="check"><input type="checkbox" name="ingresos" checked> Importar ingreso constante e irregular de cada hoja</label>
    <label class="check"><input type="checkbox" name="omitir"> Omitir filas “Deuda › Tarjeta de crédito N”</label>
    <p class="ayuda">En tu plantilla registrabas el pago de la tarjeta como gasto. En Corte el pago de tarjeta no es gasto (se contaría doble si también capturas las compras). Para periodos pasados puedes dejarlas como gasto.</p>
    <p class="ayuda">Todos los gastos quedarán como <b>Sin clasificar</b>. Después ve a Gastos › Seleccionar › Clasificar para asignar el tipo de pago en lote. Si importas el mismo archivo dos veces, las filas repetidas se omiten.</p>
    <div class="acciones"><button class="btn prim" type="submit" id="imp-btn">Importar ${total()} gastos</button></div>
  </form>`, cuerpo => {
    const f = $('#fimp', cuerpo);
    $$('.imp-inc', cuerpo).forEach(c => c.addEventListener('change', () => { analisis[+c.dataset.i].incluir = c.checked; $('#imp-btn', cuerpo).textContent = `Importar ${total()} gastos`; }));
    $$('.imp-per', cuerpo).forEach(c => c.addEventListener('change', () => { if (esFecha(c.value)) analisis[+c.dataset.i].periodo = periodoDe(c.value, ini()); }));
    f.addEventListener('submit', e => {
      e.preventDefault();
      const r = aplicarPlantilla(ST, analisis, { omitirDeudaTarjeta: f.omitir.checked, importarIngresos: f.ingresos.checked });
      ST.config.bienvenida = true; guardar(); cerrarHoja();
      F = { q: '', cat: '', tipo: 'sin', cuenta: '', rango: 'todo' }; VISTA = 'gastos'; render();
      toast(`Importados ${r.gastos} gastos${r.ingresos ? `, ${r.ingresos} ingresos` : ''}${r.duplicados ? ` · ${r.duplicados} repetidos omitidos` : ''}${r.sinMonto ? ` · ${r.sinMonto} sin monto` : ''}`);
    });
  });
}

function descargar(blob, nombre) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click();

}

  'borrar-ic': el => { ST.ingresoConstante = ST.ingresoConstante.filter(x => x.desde !== el.dataset.d); guardar(); render(); },
  'nueva-cat': () => { const n = prompt('Nombre de la nueva categoría'); if (!n || !n.trim()) return; ST.categorias.push({ id: nuevoId('c'), nombre: n.trim(), oculta: false, _abierta: true, subs: [{ id: nuevoId('s'), nombre: 'General', necesario: false, presupuesto: 0, oculta: false }] }); guardar(); render(); },
  'nueva-sub': el => { const c = catDe(ST, el.dataset.c), n = prompt('Nombre de la subcategoría en ' + c.nombre); if (!n || !n.trim()) return; c.subs.push({ id: nuevoId('s'), nombre: n.trim(), necesario: false, presupuesto: 0, oculta: false }); c._abierta = true; guardar(); render(); },
  'borrar-sub': el => { const c = catDe(ST, el.dataset.c); if (c.subs.length === 1) { toast('Una categoría necesita al menos una subcategoría'); return; } c.subs = c.subs.filter(s => s.id !== el.dataset.s); c._abierta = true; guardar(); render(); },
  'borrar-cat': el => { if (!confirm('¿Borrar la categoría?')) return; ST.categorias = ST.categorias.filter(c => c.id !== el.dataset.c); guardar(); render(); },
  'nueva-bolsa': () => { const n = prompt('Nombre de la cuenta o bolsa (ej. Débito Santander)'); if (!n || !n.trim()) return; ST.bolsas.push({ id: nuevoId('b'), nombre: n.trim(), tipo: /efectivo/i.test(n) ? 'efectivo' : 'debito', oculta: false }); guardar(); render(); },
  'borrar-bolsa': el => { ST.bolsas = ST.bolsas.filter(b => b.id !== el.dataset.b); guardar(); render(); },
  'exportar-json': () => { descargar(respaldoBlob(), `corte-respaldo_${sello()}.json`); marcarRespaldo(); render(); toast('Respaldo descargado ✓'); },
  'compartir-json': async () => { try { const f = new File([respaldoBlob()], `corte-respaldo_${sello()}.json`, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Respaldo de Corte' }); marcarRespaldo(); render(); } else toast('Tu navegador no permite compartir archivos'); } catch (e) { if (e.name !== 'AbortError') toast('No se pudo compartir'); } },
  'importar-json': () => $('#archivo-json').click(),
  'importar-excel': () => $('#archivo-excel').click(),
  'exportar-xlsx': async () => { try { toast('Generando Excel…'); const u8 = await exportarXlsx(ST); descargar(new Blob([u8], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `corte_${sello()}.xlsx`); marcarRespaldo(); render(); toast('Excel descargado ✓'); } catch (e) { console.error(e); toast('No se pudo generar el Excel'); } },
  'exportar-csv': () => { descargar(new Blob([gastosCsv(ST)], { type: 'text/csv;charset=utf-8' }), `corte-gastos_${sello()}.csv`); toast('CSV descargado'); },
  'instalar': async () => { if (!INSTALAR) return; INSTALAR.prompt(); await INSTALAR.userChoice; INSTALAR = null; render(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el, e);
});
/* Cambios en campos editables en línea (categorías, bolsas, ajustes) */
document.addEventListener('change', e => {
  const el = e.target, c = el.dataset.campo;
  if (el.id === 'conv') { ST.config.convDias = +el.value; guardar(); render(); return; }
  if (el.id === 'recordatorio') { ST.config.recordatorioDias = +el.value; guardar(); return; }
  if (!c) return;
  const cat = el.dataset.c ? catDe(ST, el.dataset.c) : null, sub = cat && el.dataset.s ? porId(cat.subs, el.dataset.s) : null, b = el.dataset.b ? porId(ST.bolsas, el.dataset.b) : null;
  if (cat) cat._abierta = true;
  switch (c) {
    case 'cat-nombre': if (el.value.trim()) cat.nombre = el.value.trim(); break;
    case 'cat-oculta': cat.oculta = el.checked; break;
    case 'sub-nombre': if (el.value.trim()) sub.nombre = el.value.trim(); break;
    case 'sub-pres': sub.presupuesto = leerMonto(el.value) || 0; break;
    case 'sub-nec': sub.necesario = el.checked; break;
    case 'sub-oculta': sub.oculta = el.checked; break;
    case 'bolsa-nombre': if (el.value.trim()) b.nombre = el.value.trim(); break;
    case 'bolsa-tipo': b.tipo = el.value; break;
    case 'bolsa-oculta': b.oculta = el.checked; break;
  }
  guardar(); if (/oculta|tipo/.test(c)) render();
});
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.cat')) { const c = catDe(ST, d.dataset.cat); if (c) c._abierta = d.open; } }, true);
document.addEventListener('submit', e => {
  if (e.target.id === 'f-ic') {
    e.preventDefault(); const f = e.target, monto = leerMonto(f.monto.value) || 0;
    ST.ingresoConstante = ST.ingresoConstante.filter(x => x.desde !== P);
    ST.ingresoConstante.push({ desde: P, monto, cuentaId: f.cuenta.value || null }); guardar(); render(); toast('Ingreso constante guardado');
  }
  if (e.target.id === 'f-aj') {
    e.preventDefault(); const f = e.target, d = Math.min(28, Math.max(1, +f.diaInicio.value || 16));
    ST.config.diaInicio = d; ST.config.convDias = +f.convDias.value; ST.config.tema = f.tema.value;
    aplicarTema(); P = periodoDe(P, d); guardar(); render(); toast('Ajustes guardados');
  }
});
$('#archivo-json').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const st = validarEstado(JSON.parse(await file.text()));
    if (!confirm(`¿Reemplazar los datos actuales con este respaldo? (${st.gastos.length} gastos, ${st.tarjetas.length} tarjetas, ${st.inversiones.length} inversiones)`)) return;
    st.config.bienvenida = true; ST = st; guardar(); aplicarTema(); P = actual(); render(); toast('Respaldo importado ✓');
  } catch (err) { toast('Archivo inválido: ' + err.message); }
});
$('#archivo-excel').addEventListener('change', e => { const file = e.target.files[0]; e.target.value = ''; if (file) importarExcel(file); });

function loteClasificar() {
  const n = SEL.size;
  abrirHoja(`Clasificar ${n} gasto${n > 1 ? 's' : ''}`, `
  <form class="form" id="flc">
    <div class="seg" id="seg-l">${['efectivo', 'debito', 'transferencia', 'credito'].map(t => `<button type="button" data-t="${t}" class="${t === 'credito' ? 'cr' : ''}" aria-pressed="${t === 'debito'}">${t === 'transferencia' ? 'Transf.' : TIPOS[t].nombre}</button>`).join('')}</div>
    <label><span id="lc-txt">Cuenta o bolsa</span><select name="cuenta"></select></label>
    <div class="acciones"><button class="btn prim" type="submit">Aplicar a ${n}</button></div>
  </form>`, cuerpo => {
    const f = $('#flc', cuerpo); let tipo = 'debito';
    const pint = () => {
      $$('#seg-l button', cuerpo).forEach(b => b.setAttribute('aria-pressed', b.dataset.t === tipo));
      $('#lc-txt', cuerpo).textContent = tipo === 'credito' ? 'Tarjeta' : 'Cuenta o bolsa';
      f.cuenta.innerHTML = tipo === 'credito' ? opciones(ST.tarjetas.map(t => [t.id, t.alias]), (ST.tarjetas[0] || {}).id) : opciones(bolsasVisibles().map(b => [b.id, b.nombre]), (bolsasVisibles().find(b => tipo === 'efectivo' ? b.tipo === 'efectivo' : b.tipo !== 'efectivo') || {}).id, '—');
    };
    pint(); $('#seg-l', cuerpo).addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tipo = b.dataset.t; pint(); } });
    f.addEventListener('submit', e => {
      e.preventDefault(); if (tipo === 'credito' && !f.cuenta.value) { toast('Agrega una tarjeta primero'); return; }
      ST.gastos.forEach(g => { if (SEL.has(g.id)) { g.tipo = tipo; g.tarjetaId = tipo === 'credito' ? f.cuenta.value : null; g.cuentaId = tipo === 'credito' ? null : (f.cuenta.value || null); if (tipo !== 'credito') g.msi = 1; } });
      SEL = new Set(); guardar(); cerrarHoja(); render(); toast(`${n} gastos clasificados`);
    });
  });
}
function loteCategoria() {
  const n = SEL.size;
  abrirHoja(`Cambiar categoría de ${n}`, `<form class="form" id="flk"><div class="fila2"><label>Categoría<select name="cat">${opciones(catsVisibles().map(c => [c.id, c.nombre]), ST.categorias[0].id)}</select></label><label>Subcategoría<select name="sub"></select></label></div>
    <div class="acciones"><button class="btn prim" type="submit">Aplicar</button></div></form>`, cuerpo => {
    const f = $('#flk', cuerpo); const ps = () => { f.sub.innerHTML = opciones(subsVisibles(catDe(ST, f.cat.value)).map(s => [s.id, s.nombre])); };
    ps(); f.cat.addEventListener('change', ps);
    f.addEventListener('submit', e => { e.preventDefault(); ST.gastos.forEach(g => { if (SEL.has(g.id)) { g.catId = f.cat.value; g.subId = f.sub.value; } }); SEL = new Set(); guardar(); cerrarHoja(); render(); toast('Categoría actualizada'); });
  });
}
function formIngresoInicial() {
  abrirHoja('Primeros pasos', `<div class="form">
    <p style="margin:0">Para empezar te sugiero:</p>
    <ol style="margin:0;padding-left:20px;line-height:1.8"><li>Captura tu <b>ingreso constante</b> (Más › Ingresos).</li><li>Agrega tus <b>tarjetas</b> con día de corte y de pago.</li><li>Ajusta tus <b>cuentas o bolsas</b> (Efectivo, Débito…).</li><li>Si tienes tu Excel, impórtalo en <b>Más › Datos</b>.</li></ol>
    <div class="btns"><button class="btn prim" data-a="mas" data-s="ingresos">Ingresos</button><button class="btn" data-a="mas" data-s="datos">Importar Excel</button></div></div>`);
}
function borrarEjemplo() {
  const esEj = x => x && x.ejemplo;
  ST.gastos = ST.gastos.filter(g => !esEj(g)); ST.ingresos = ST.ingresos.filter(i => !esEj(i)); ST.pagos = ST.pagos.filter(p => !esEj(p));
  ST.inversiones = ST.inversiones.filter(i => !esEj(i)); ST.ingresoConstante = ST.ingresoConstante.filter(x => !esEj(x));
  const usadas = new Set([...ST.gastos.map(g => g.tarjetaId), ...ST.pagos.map(p => p.tarjetaId)]);
  ST.tarjetas = ST.tarjetas.filter(t => !esEj(t) || usadas.has(t.id));
  const bUsadas = new Set([...ST.gastos.map(g => g.cuentaId), ...ST.pagos.map(p => p.cuentaId), ...ST.ingresos.map(i => i.cuentaId)]);
  ST.bolsas = ST.bolsas.filter(b => !esEj(b) || bUsadas.has(b.id));
  ST.bolsas.forEach(b => { if (b.nombreOriginal && !bUsadas.has(b.id)) { b.nombre = b.nombreOriginal; delete b.nombreOriginal; } });
  delete ST.ejemplo; ST.config.ultimoRespaldo = null; guardar(); render(); toast('Datos de ejemplo borrados. ¡Listo para tus datos reales!');
}

/* ---------- Tema, PWA e inicio ---------- */
function aplicarTema() { const t = ST && ST.config.tema; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALAR = e; if (VISTA === 'mas') render(); });
function registrarSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing; if (!nw) return;
      nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('Hay una versión nueva', { texto: 'Actualizar', fn: () => nw.postMessage('activar') }); });
    });
  }).catch(err => console.warn('Service worker no registrado', err));
  // Solo recargar cuando una versión nueva reemplaza a otra (no en la primera instalación)
  const habiaControlador = !!navigator.serviceWorker.controller; let recargado = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (habiaControlador && !recargado) { recargado = true; location.reload(); } });
}
async function iniciar() {
  await Almacen.abrir();
  let datos = null;
  try { datos = await Almacen.leer(); } catch (e) { console.warn(e); }
  try { ST = datos ? validarEstado(datos) : estadoVacio(); }
  catch (e) { console.error(e); ST = estadoVacio(); toast('No se pudieron leer los datos guardados'); }
  aplicarTema();
  P = actual();
  render();
  registrarSW();
  // Al volver a la app otro día, refrescar el periodo e intereses
  let ultimoDia = hoy();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && hoy() !== ultimoDia) { if (P === periodoDe(ultimoDia, ini())) P = actual(); ultimoDia = hoy(); limpiarCache(); render(); } });
}
window.addEventListener('error', e => console.error('Error:', e.message));
iniciar();

</script>
